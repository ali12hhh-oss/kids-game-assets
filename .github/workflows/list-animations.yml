name: List animations
on:
  push:
    paths:
      - '.github/workflows/list-animations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @gltf-transform/core
      - run: node tools/list-animations.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ANIMATIONS.md
          git diff --cached --quiet || git commit -m "docs: list animation names"
          git push
