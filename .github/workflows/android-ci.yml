name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate launcher PNG density sizes
        if: ${{ hashFiles('app/src/main/res/mipmap-xhdpi/ic_launcher.png') }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("app/src/main/res/mipmap-xhdpi/ic_launcher.png")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          image = Image.open(source).convert("RGBA")
          for density, size in sizes.items():
              target = Path(f"app/src/main/res/mipmap-{density}/ic_launcher.png")
              target.parent.mkdir(parents=True, exist_ok=True)
              if image.size == (size, size):
                  image.save(target, format="PNG", optimize=True)
              else:
                  image.resize((size, size), Image.Resampling.LANCZOS).save(
                      target, format="PNG", optimize=True
                  )
          PY

          if ! git diff --quiet -- app/src/main/res/mipmap-*/ic_launcher.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/mipmap-*/ic_launcher.png
            git commit -m "Generate launcher PNG density sizes"
            git push
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle configuration
        run: gradle tasks --no-daemon

      - name: Run Android lint with warnings treated as errors
        run: gradle :app:lintDebug --no-daemon

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Assemble release AAB
        run: gradle :app:bundleRelease --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: kids-learning-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
