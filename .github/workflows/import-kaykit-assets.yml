name: Import licensed KayKit assets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download selected CC0 KayKit assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Assets/gltf"
          dest="app/src/main/assets/characters/KayKit/Accessories"
          outfit_dest="app/src/main/assets/characters/KayKit/Outfits"
          mkdir -p "$dest" "$outfit_dest"

          for asset in \
            sword_1handed sword_2handed sword_2handed_color \
            axe_1handed axe_2handed dagger \
            crossbow_1handed crossbow_2handed \
            staff wand arrow arrow_bundle quiver \
            shield_badge shield_badge_color shield_round shield_round_barbarian \
            shield_round_color shield_spikes shield_spikes_color \
            shield_square shield_square_color \
            smokebomb spellbook_closed spellbook_open; do
            curl -fsSL "$base/$asset.gltf" -o "$dest/$asset.gltf"
            curl -fsSL "$base/$asset.bin" -o "$dest/$asset.bin"
          done

          character_base="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Characters/gltf"
          for outfit in Knight Rogue Mage; do
            curl -fsSL "$character_base/$outfit.glb" -o "$outfit_dest/$outfit.glb"
          done

          curl -fsSL "https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/LICENSE.txt" \
            -o "$dest/LICENSE.txt"

          # Extra lightweight CC0 weapons/shields already shipped by KayKit.
          # Keep the original filenames so the game can reference them directly.
          cp "$dest/LICENSE.txt" "$outfit_dest/LICENSE.txt"

      - name: Record provenance
        shell: bash
        run: |
          cat > app/src/main/assets/characters/KayKit/Accessories/SOURCES.md <<'EOF'
          # KayKit accessories

          Source: KayKit - Character Pack : Adventurers 1.0
          Creator: Kay Lousberg / KayKit
          License: CC0 1.0 Universal
          Official source: https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0
          Original asset page: https://kaylousberg.itch.io/kaykit-adventurers

          Imported mobile-friendly accessory/equipment models:
          swords, axes, dagger, crossbows, staff, wand, arrows, quiver,
          shields, smokebomb, and spellbook variants.

          Imported lightweight character outfit variants from the same pack:
          Knight.glb, Rogue.glb, Mage.glb.
          These self-contained CC0 character GLBs are used as Reebo's alternate
          game-store outfits; the default mannequin remains available when no
          outfit is equipped.

          These files are intentionally limited to a lightweight subset.
          EOF

      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/characters/KayKit/Accessories app/src/main/assets/characters/KayKit/Outfits
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "توسيع مجموعة إكسسوارات وأسلحة KayKit المرخصة CC0"
          git push
